[package]
name = "uploadzx-hash"
version = "0.1.0"
edition = "2021"
description = "Streaming BLAKE3 / SHA-256 hasher compiled to WebAssembly for uploadzx"
license = "MIT"
repository = "https://github.com/Hezx13/uploadzx"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
blake3 = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
